<!doctype html>
<!--
One-Button Chaos — Single-file site
Drop this file as `index.html` in a GitHub Pages repository (root of `main` branch) and it will work.
Quick deploy steps:
1. Create a new GitHub repo (public or private).
2. Add this file as `index.html` to the repository root and commit.
3. In repo Settings -> Pages, set source to `main` branch / root. Wait a minute — it will be live at `https://<your-user>.github.io/<repo>/`.

This single-file implements 35 random behaviors described by the user. It's plain HTML/CSS/JS (no build step) so it's GH-Pages friendly.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The One Button — Chaos Machine</title>
  <style>
    :root{--bg:#0b1020;--card:#0f1724;--accent:#7c3aed;--glass:rgba(255,255,255,0.04)}
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    body{background:linear-gradient(180deg,#031021 0%, #061428 50%, #07192b 100%);display:flex;align-items:center;justify-content:center;color:#e6eef8}
    .wrap{width:100%;max-width:980px;padding:28px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:14px;padding:28px;box-shadow:0 10px 30px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03)}
    h1{margin:0 0 8px;font-size:28px}
    p{margin:0 0 16px;color:#bcd3f2}
    .center{display:flex;align-items:center;justify-content:center}
    button#big{background:linear-gradient(180deg,var(--accent),#5b21b6);border:0;padding:28px 44px;border-radius:999px;font-size:20px;cursor:pointer;box-shadow:0 8px 30px rgba(124,58,237,0.28);color:white}
    .meta{margin-top:12px;color:#9fb6df;font-size:13px}
    .tiny{font-size:12px;color:#92aedd}
    canvas#art{width:100%;height:220px;border-radius:10px;display:block}

    /* overlays and utilities */
    .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999}
    .hidden{display:none}
    .modal{background:var(--card);padding:18px;border-radius:12px;max-width:820px;max-height:80vh;overflow:auto}
    .small{font-size:14px}
    .ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 12px;border-radius:8px;color:#dfeafe}
    .confetti-canvas{position:fixed;left:0;top:0;pointer-events:none;z-index:9998}
    .terminal{background:black;color:#4af626;padding:18px;border-radius:10px;font-family:monospace;max-width:760px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card center" style="flex-direction:column;gap:14px">
      <h1>The One Button — Chaos Machine</h1>
      <p class="tiny">Click the big button. Something random will happen (35 fun/strange/useful effects implemented).</p>
      <div class="center" style="width:100%">
        <button id="big">DON'T PRESS • PRESS</button>
      </div>
      <div class="meta center">
        <div id="last" class="tiny">Ready — 35 effects</div>
      </div>
    </div>
  </div>

  <!-- canvases and overlays -->
  <canvas id="confetti" class="confetti-canvas hidden"></canvas>
  <div id="overlay" class="overlay hidden"><div id="modal" class="modal"></div></div>
  <canvas id="art" class="hidden"></canvas>
  <div id="terminalOverlay" class="overlay hidden"><div id="terminal" class="terminal"></div></div>

  <script>
    /********************* Utility and state *********************/
    const effects = [];
    const lastEl = document.getElementById('last');
    const big = document.getElementById('big');
    const overlay = document.getElementById('overlay');
    const modal = document.getElementById('modal');
    const artCanvas = document.getElementById('art');
    const confettiCanvas = document.getElementById('confetti');
    const terminalOverlay = document.getElementById('terminalOverlay');
    const terminal = document.getElementById('terminal');

    function pickRandom(){return Math.floor(Math.random()*effects.length)}
    function showModal(html, timeout){overlay.classList.remove('hidden');modal.innerHTML = html; if(timeout) setTimeout(hideModal, timeout)}
    function hideModal(){overlay.classList.add('hidden');modal.innerHTML='';}
    function showTerminal(text, ms=3000){terminalOverlay.classList.remove('hidden');terminal.textContent='';let i=0;const t=setInterval(()=>{terminal.textContent+=text[i++]||''; if(i>text.length){clearInterval(t); setTimeout(()=>terminalOverlay.classList.add('hidden'), ms)}},25)}
    function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}
    function typeWriter(el, text, speed=25){el.textContent='';let i=0;const t=setInterval(()=>{el.textContent+=text[i++]||''; if(i>text.length) clearInterval(t)}, speed)}
    function openRandomSite(){const sites=['https://theuselessweb.com/','https://pointerpointer.com/','https://smashthewalls.com/'];window.open(sites[randInt(0,sites.length-1)],'_blank')}

    /********************* 1. Screen Glitch + Fake System Error *********************/
    effects.push(()=>{
      const g = document.createElement('div');g.style.position='fixed';g.style.inset='0';g.style.background='linear-gradient(90deg, rgba(0,0,0,0.2), rgba(255,255,255,0.03))';g.style.mixBlendMode='difference';g.style.zIndex=9997;document.body.appendChild(g);
      lastEl.textContent='Screen glitch — hold tight for 1.5s';setTimeout(()=>{document.body.removeChild(g);lastEl.textContent='Ready'},1500);
    });

    /********************* 2. Random Meme Drop *********************/
    const memes = ['😂 You silly!','🌚 When you click and expect things','🐶 Doge says wow','😹 Meme delivered!'];
    effects.push(()=>{showModal(`<div style="font-size:22px;">${memes[randInt(0,memes.length-1)]}</div>`,2200); lastEl.textContent='Meme drop'});

    /********************* 3. Fake Lottery Win *********************/
    effects.push(()=>{showModal(`<div style="font-size:20px;color:gold">🎉 Congratulations! You won ₹${randInt(1000,999999)}</div>`,1800); lastEl.textContent='You were almost rich'});

    /********************* 4. Random Roast Generator *********************/
    const roasts = ['You code like a comment without context.','Your WiFi has more drama than you.','You are the human version of a typo.'];
    effects.push(()=>{showModal(`<div class="small">${roasts[randInt(0,roasts.length-1)]}</div>`,2500); lastEl.textContent='Roast delivered'});

    /********************* 5. Soft Jumpscare *********************/
    effects.push(()=>{const img=document.createElement('div');img.style.position='fixed';img.style.inset='0';img.style.background='url(https://picsum.photos/seed/jump/1200/800) center/cover';img.style.zIndex=9999;document.body.appendChild(img);setTimeout(()=>{document.body.removeChild(img)},700); lastEl.textContent='Jump!'});

    /********************* 6. Confetti Explosion *********************/
    effects.push(()=>{confettiCanvas.classList.remove('hidden');confettiCanvas.width=innerWidth;confettiCanvas.height=innerHeight;const ctx=confettiCanvas.getContext('2d');let pieces=[];for(let i=0;i<120;i++){pieces.push({x:Math.random()*innerWidth,y:Math.random()*-innerHeight/2,vx:(Math.random()-0.5)*6,vy:Math.random()*6+2,r:randInt(4,8),c:`hsl(${randInt(0,360)},80%,65%)`})}
      let t=0;const loop=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r, p.r)});t++;if(t<200) requestAnimationFrame(loop); else {confettiCanvas.classList.add('hidden'); lastEl.textContent='Confetti!' }};loop(); lastEl.textContent='Celebration'});

    /********************* 7. Fake Hacker Terminal *********************/
    effects.push(()=>{showTerminal('> Connecting...\n> Accessing neural cache...\n> DECRYPTING...\n> 0x4a 0x1f 0x90 \n> HACK COMPLETE',4000); lastEl.textContent='Hacker mode'});

    /********************* 8. Random Website Teleport *********************/
    effects.push(()=>{openRandomSite(); lastEl.textContent='Teleported'});

    /********************* 9. Instant Generative Art *********************/
    effects.push(()=>{
      artCanvas.classList.remove('hidden'); artCanvas.width = artCanvas.clientWidth*devicePixelRatio; artCanvas.height = 220*devicePixelRatio; const ctx = artCanvas.getContext('2d'); ctx.scale(devicePixelRatio,devicePixelRatio);
      ctx.clearRect(0,0,artCanvas.clientWidth,220);
      for(let i=0;i<60;i++){ctx.fillStyle=`hsl(${randInt(0,360)},60%,${randInt(30,70)}%)`;ctx.beginPath();ctx.ellipse(Math.random()*artCanvas.clientWidth,Math.random()*220,Math.random()*120,Math.random()*60,Math.random()*Math.PI,0,Math.PI*2);ctx.fill()}
      lastEl.textContent='Generative art'; setTimeout(()=>{artCanvas.classList.add('hidden');},4500);
    });

    /********************* 10. Poem From Chaos *********************/
    const words = ['midnight','glow','circuit','whisper','gravity','pixel','hollow','orbit','echo'];
    effects.push(()=>{const poem = Array.from({length:6}).map(()=>words[randInt(0,words.length-1)]).join(' — '); showModal(`<div style="font-size:18px">${poem}</div>`,3000); lastEl.textContent='A poem appeared'});

    /********************* 11. Pixel Mutation *********************/
    effects.push(()=>{const body = document.body; body.style.transition='filter .6s'; body.style.filter='blur(6px)'; setTimeout(()=>{body.style.filter='none'},800); lastEl.textContent='Pixel mutation'});

    /********************* 12. Random Color Universe *********************/
    effects.push(()=>{const c1=randInt(0,360), c2=randInt(0,360);document.body.style.background=`linear-gradient(180deg,hsl(${c1},60%,6%), hsl(${c2},60%,8%))`; lastEl.textContent='Colors shifted'});

    /********************* 13. ASCII Universe *********************/
    effects.push(()=>{const txt = `ASCII MODE\n` + Array.from({length:8}).map(()=>Array.from({length:40}).map(()=>String.fromCharCode(randInt(33,126))).join('')).join('\n'); showModal(`<pre style="font-family:monospace;color:#bcd3f2">${txt}</pre>`,2500); lastEl.textContent='ASCII art'});

    /********************* 14. "I Know You" Illusion *********************/
    effects.push(()=>{const info = `Browser: ${navigator.userAgent.split('(')[0]}\nTime: ${new Date().toLocaleString()}\nViewport: ${innerWidth}×${innerHeight}`; showModal(`<pre>${info}</pre>`,3500); lastEl.textContent='Spooky knowledge'});

    /********************* 15. Prophecy Generator *********************/
    const props = ['A small gift is coming','You will forget an item','You will meet a stranger who smiles'];
    effects.push(()=>{showModal(`<div>${props[randInt(0,props.length-1)]}</div>`,2000); lastEl.textContent='Prophecy'});

    /********************* 16. Reality Question *********************/
    const qs = ['What is real to you?','If time was a color, which would it be?','Is silence loud?'];
    effects.push(()=>{showModal(`<div style="font-size:16px">${qs[randInt(0,qs.length-1)]}</div>`); lastEl.textContent='Question posed'});

    /********************* 17. Fear Button (confirm) *********************/
    effects.push(()=>{if(confirm('ARE YOU SURE? Click OK to proceed.')){alert('You are bold.')} lastEl.textContent='Fear tested'});

    /********************* 18. Instant Mini Game (simple dodger) *********************/
    effects.push(()=>{
      // tiny dodge game: avoid falling blocks for 8 seconds
      const gWrap = document.createElement('div'); gWrap.style.position='fixed'; gWrap.style.inset='0'; gWrap.style.zIndex=9999; gWrap.style.display='flex'; gWrap.style.alignItems='center'; gWrap.style.justifyContent='center';
      const g = document.createElement('canvas'); g.width=400; g.height=300; g.style.borderRadius='10px'; g.style.background='#081426'; gWrap.appendChild(g); document.body.appendChild(gWrap);
      const ctx=g.getContext('2d'); let playerX=180; let blocks=[]; let alive=true; let score=0;
      function loop(){ctx.clearRect(0,0,400,300); ctx.fillStyle='#7c3aed'; ctx.fillRect(playerX,270,40,20); if(Math.random()<0.03) blocks.push({x:randInt(0,360),y:-20}); blocks.forEach(b=>{b.y+=3;ctx.fillStyle='#ff6b6b';ctx.fillRect(b.x,b.y,40,20); if(b.y>260 && Math.abs(b.x-playerX)<40) alive=false}); score++; if(alive) requestAnimationFrame(loop); else {ctx.fillStyle='white'; ctx.fillText('Game Over',160,150); setTimeout(()=>document.body.removeChild(gWrap),1800)}}
      window.addEventListener('keydown', (e)=>{if(e.key==='ArrowLeft') playerX-=20; if(e.key==='ArrowRight') playerX+=20; playerX=Math.max(0,Math.min(360,playerX))}); loop(); setTimeout(()=>{if(alive){document.body.removeChild(gWrap);alert('You survived!')}},8000); lastEl.textContent='Mini-game'});

    /********************* 19. Reaction Test *********************/
    effects.push(()=>{const start = Date.now()+randInt(800,2500); showModal(`<div id='react' class='small'>Wait for green...</div>`); const reactEl=document.getElementById('react'); setTimeout(()=>{reactEl.textContent='CLICK!'; const t0=Date.now(); document.body.addEventListener('click',function f(){const ms=Date.now()-t0; showModal(`<div>Reaction: ${ms}ms</div>`,2200); document.body.removeEventListener('click',f)}, {once:true})}, start - Date.now()); lastEl.textContent='Reaction test'});

    /********************* 20. 1-Chance Challenge *********************/
    effects.push(()=>{const t=randInt(2,6); const ans=prompt(`You have one chance. Type the number ${t} to win:`); if(ans==t) alert('Winner!') else alert('Missed.'); lastEl.textContent='One-chance challenge'});

    /********************* 21. Random Productivity Tip *********************/
    const tips=['Pomodoro: 25/5','Breaks every 90 min','Write one sentence first']; effects.push(()=>{showModal(`<div>${tips[randInt(0,tips.length-1)]}</div>`,1800); lastEl.textContent='Productivity tip'});

    /********************* 22. Random AI Tool Suggestion *********************/
    const tools=['Try an image-to-text tool','Use code playgrounds','Experiment with embeddings']; effects.push(()=>{showModal(`<div>${tools[randInt(0,tools.length-1)]}</div>`,1800); lastEl.textContent='AI tool idea'});

    /********************* 23. Random Coding Snippet *********************/
    effects.push(()=>{showModal(`<pre style="font-family:monospace">console.log('Hello world')</pre>`,1800); lastEl.textContent='Snippet'});

    /********************* 24. Random Life Hack *********************/
    const hacks=['Use binder clips to organize cables','Fold shirts vertical for drawers']; effects.push(()=>{showModal(`<div>${hacks[randInt(0,hacks.length-1)]}</div>`,1800); lastEl.textContent='Life hack'});

    /********************* 25. Motivational Quote Chaos Mode *********************/
    const quotes=['Start small. Finish big.','You cannot fail if you try again.']; effects.push(()=>{showModal(`<div style="font-size:18px">${quotes[randInt(0,quotes.length-1)]}</div>`,2200); lastEl.textContent='Motivation'});

    /********************* 26. Mouse Gravity Flip *********************/
    effects.push(()=>{document.body.style.transition='transform 0.6s'; document.body.style.transform='rotate(180deg)'; setTimeout(()=>{document.body.style.transform='';},1200); lastEl.textContent='Gravity flipped'});

    /********************* 27. Time Reversal Illusion *********************/
    effects.push(()=>{const el=document.querySelector('.card'); el.style.animation='rev 1s linear'; el.style.transition='transform .8s'; el.style.transform='scaleX(-1)'; setTimeout(()=>{el.style.transform='';},900); lastEl.textContent='Time reversed'});

    /********************* 28. Fake Lag Simulation *********************/
    effects.push(()=>{document.body.style.pointerEvents='none'; lastEl.textContent='Lagging...'; setTimeout(()=>{document.body.style.pointerEvents=''; lastEl.textContent='Ready'},2200)});

    /********************* 29. Mirror Screen *********************/
    effects.push(()=>{document.body.style.transform='scaleX(-1)'; setTimeout(()=>{document.body.style.transform='';},1200); lastEl.textContent='Mirror mode'});

    /********************* 30. Silent Mode (blackout) *********************/
    effects.push(()=>{const b=document.createElement('div');b.style.position='fixed';b.style.inset='0';b.style.background='black';b.style.zIndex=9999;document.body.appendChild(b); setTimeout(()=>{document.body.removeChild(b)},1500); lastEl.textContent='Silent mode'});

    /********************* 31. "Your Brain Age" Generator *********************/
    effects.push(()=>{showModal(`<div>Your brain age: ${randInt(12,74)}</div>`,1800); lastEl.textContent='Brain age'});

    /********************* 32. Random Personality Test Result *********************/
    const pers=['Adventurer','Skeptic','Dreamer','Analyst']; effects.push(()=>{showModal(`<div>${pers[randInt(0,pers.length-1)]}</div>`,2000); lastEl.textContent='Personality result'});

    /********************* 33. Your Internet Mood Today *********************/
    const moods=['Curious','Tired','Hyper','Chill']; effects.push(()=>{showModal(`<div>Internet mood: ${moods[randInt(0,moods.length-1)]}</div>`,1600); lastEl.textContent='Mood delivered'});

    /********************* 34. Your Luck % Today *********************/
    effects.push(()=>{showModal(`<div>Luck: ${randInt(1,100)}%</div>`,1400); lastEl.textContent='Luck read'});

    /********************* 35. Your Superpower Today *********************/
    const sp=['Teleportation (short hops)','Speed-reading','Snack-summoning']; effects.push(()=>{showModal(`<div>${sp[randInt(0,sp.length-1)]}</div>`,2200); lastEl.textContent='Superpower'});

    /********************* Combo / Weighted randomness example *********************/
    function weightedPick(){ // 60% normal fun (0-20), 25% useful (21-27), 10% weird (28-32), 5% extreme (33-34)
      const r=Math.random(); if(r<0.6) return randInt(0,20); if(r<0.85) return randInt(21,27); if(r<0.95) return randInt(28,32); return randInt(33,34);
    }

    big.addEventListener('click', ()=>{
      big.disabled=true; setTimeout(()=>big.disabled=false,300);
      const i = weightedPick(); effects[i]();
    });

    // close overlay on click outside
    overlay.addEventListener('click', (e)=>{if(e.target===overlay) hideModal()});
    terminalOverlay.addEventListener('click', ()=>{terminalOverlay.classList.add('hidden')});

    // make canvas responsive
    window.addEventListener('resize', ()=>{confettiCanvas.width=innerWidth; confettiCanvas.height=innerHeight});

    // initial random seed visual
    lastEl.textContent='Ready — click the button!'
  </script>
</body>
</html>
